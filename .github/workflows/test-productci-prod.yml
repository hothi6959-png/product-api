name: Product API Integration CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check server.js

      - name: Verify MongoDB connection
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/productdb
        run: |
          node -e "const mongoose=require('mongoose'); mongoose.connect(process.env.MONGO_URI).then(()=>{console.log('MongoDB connected');process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"