
name: Product API CD - Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: pwsh
        run: node --check server.js

      - name: Create test environment
        shell: pwsh
        run: |
          "PORT=3000`nMONGO_URI=mongodb://mongodb:27017/productdb" | Set-Content -Path .env

      - name: Start application and MongoDB
        shell: pwsh
        run: docker compose up -d --build

      - name: Wait for healthchecks
        shell: pwsh
        run: |
          $healthy = $false

          for ($i = 0; $i -lt 30; $i++) {
            $mongoId = docker compose ps -q mongodb
            $apiId = docker compose ps -q product-api

            $mongoStatus = "starting"
            $apiStatus = "starting"

            if ($mongoId) {
              $mongoStatus = docker inspect --format='{{.State.Health.Status}}' $mongoId
            }

            if ($apiId) {
              $apiStatus = docker inspect --format='{{.State.Health.Status}}' $apiId
            }

            Write-Host "MongoDB: $mongoStatus | Product API: $apiStatus"

            if ($mongoStatus -eq "healthy" -and $apiStatus -eq "healthy") {
              $response = Invoke-WebRequest -Uri "http://localhost:3000/products" -UseBasicParsing
              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            }

            Start-Sleep -Seconds 2
          }

          if (-not $healthy) {
            docker compose ps
            docker compose logs
            throw "Healthcheck failed"
          }

      - name: Stop test containers
        if: always()
        shell: pwsh
        run: docker compose down

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/product-api:latest
